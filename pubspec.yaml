name: murat_ile_ogren
description: Murat İle Öğren - gerçek Flutter iOS ve Android eğitim uygulaması
publish_to: none
version: 1.2.9+16
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  video_player: ^2.10.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_full.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#F7F9F5'
  adaptive_icon_foreground: assets/app_icon.png

flutter_native_splash:
  color: '#FFFFFF'
  android_12:
    color: '#FFFFFF'
    image: assets/native_blank.png
